version: "3.8"

name: spinesense

services:
  mysql:
    image: mysql:8.0
    container_name: spinesense-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spinesense}
      MYSQL_USER: ${MYSQL_USER:-spinesense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spinepass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass} 
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --innodb-buffer-pool-size=256M
    networks:
      - spine-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: spinesense-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER:-spinesense}
      DB_PASSWORD: ${MYSQL_PASSWORD:-spinepass}
      DB_NAME: ${MYSQL_DATABASE:-spinesense}
      JWT_SECRET: ${JWT_SECRET:-change-me}
    ports:
      - "5000:5000"
    networks:
      - spine-net
    volumes:
      - ./backend:/app

volumes:
  mysql-data:

networks:
  spine-net:
    driver: bridge